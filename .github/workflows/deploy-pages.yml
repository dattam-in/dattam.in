name: Deploy dattam.in to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

# Prod repo (dattam-in/dattam.in) serves the apex domain: no basePath,
# keep CNAME. Any other repo (e.g. the himohitmehta/dattam test env) serves
# from a project-page subpath, so build with basePath and drop the CNAME.
# NOTE: compare against the literal repo slug — the `env` context does not
# resolve inside the `${{ }}` used for a step's env, which previously made
# the prod check fail and wrongly applied a "/dattam.in" basePath.

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build static export
        run: pnpm --filter @dattam/web build
        env:
          # "/<repo-name>" on test repos, "" on the prod apex domain.
          # Condition is inverted so the truthy branch holds the NON-empty
          # value: `A && '' || B` returns B when prod matches because '' is
          # falsy (GitHub Actions ternary trap). Put the basePath in the
          # truthy branch instead.
          PAGES_BASE_PATH: ${{ github.repository != 'dattam-in/dattam.in' && format('/{0}', github.event.repository.name) || '' }}

      - name: Drop CNAME on non-prod repos
        if: github.repository != 'dattam-in/dattam.in'
        run: rm -f apps/dattam.in/out/CNAME

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/dattam.in/out

  # Deploy only from main so test branches / PRs verify the build
  # without touching any live site.
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Enable Pages (idempotent)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - id: deployment
        uses: actions/deploy-pages@v4
